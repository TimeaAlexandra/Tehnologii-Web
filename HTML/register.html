<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înregistrare</title>
    <link rel="stylesheet" href="../CSS/register_style.css">
</head>
<body>
    <main class="page">
        <section class="card">
            <h1>Înregistrează-te</h1>
            <form class="register-form" action="#" method="post" enctype="multipart/form-data">
                
                <div class="row">
                    <label for="username">Nume utilizator</label>
                    <input type="text" id="username" name="username" placeholder="ex: maria92" required>
                </div>

                <div class="row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="ex: nume@exemplu.com" required>
                </div>

                <div class="row two-col">
                    <div>
                        <label for="password">Parolă</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div>
                        <label for="confirm_password">Confirmă parola</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>
                </div>

                <div class="row">
                    <label class="section-label">Gen</label>
                    <div class="gender-list">
                        <div class="gender-item">
                            <span>Femeie</span>
                            <input type="radio" name="gender" value="femeie">
                        </div>
                        <div class="gender-item">
                            <span>Bărbat</span>
                            <input type="radio" name="gender" value="barbat">
                        </div>
                        <div class="gender-item">
                            <span>Altul</span>
                            <input type="radio" name="gender" value="altul">
                        </div>
                    </div>
                </div>

                <div class="row">
                    <label for="account-type">Tip cont</label>
                    <select id="account-type" name="account_type">
                        <option value="" disabled selected>Selectează</option>
                        <option value="student">Student</option>
                        <option value="profesor">Profesor</option>
                    </select>
                </div>

                <div class="row">
                    <label class="section-label">Interese</label>
                    <div class="interests-grid">
                        <label class="interest-item">
                            <input type="checkbox" name="interests" value="frontend">
                            <span>Frontend</span>
                        </label>
                        <label class="interest-item">
                            <input type="checkbox" name="interests" value="backend">
                            <span>Backend</span>
                        </label>
                        <label class="interest-item">
                            <input type="checkbox" name="interests" value="uxui">
                            <span>UX/UI</span>
                        </label>
                        <label class="interest-item">
                            <input type="checkbox" name="interests" value="javascript">
                            <span>JavaScript</span>
                        </label>
                        <label class="interest-item">
                            <input type="checkbox" name="interests" value="python">
                            <span>Python Web</span>
                        </label>
                        <label class="interest-item">
                            <input type="checkbox" name="interests" value="wordpress">
                            <span>WordPress</span>
                        </label>
                        <label class="interest-item">
                            <input type="checkbox" name="interests" value="django">
                            <span>Django</span>
                        </label>
                    </div>
                </div>

                <div class="row">
                    <label for="avatar">Încărcă avatar</label>
                    <input type="file" id="avatar" name="avatar" class="file-input">
                </div>

                <div class="row">
                    <label for="description">Scurtă descriere</label>
                    <textarea id="description" name="description" rows="2" placeholder="Scrie câteva cuvinte despre tine..."></textarea>
                </div>

                <div class="actions">
                    <button type="submit" class="btn primary">Creează cont</button>
                    <button type="reset" class="btn ghost">Resetează</button>
                </div>

                <p class="login-link">
                    Ai deja cont? <a href="login.html">Mergi la login</a>
                </p>

            </form>
        </section>
    </main>
</body>
</html>
